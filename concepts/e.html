<!doctype html><html lang="ja"><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@200;300&family=Shippori+Mincho:wght@400&display=swap" rel=stylesheet>
<style>
*{margin:0;box-sizing:border-box}
body{min-height:100svh;color:#f4f1ea;font-family:"Cormorant Garamond","Shippori Mincho","Hiragino Mincho ProN",serif;font-weight:300;overflow:hidden;position:relative;
background:radial-gradient(120% 80% at 50% 0%,#c9c4bb 0,transparent 60%),linear-gradient(180deg,#b9b2a7 0%,#a29887 55%,#6f6558 100%)}
#stage{position:fixed;inset:0;width:100%;height:100%}
header{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;padding:28px clamp(20px,3vw,40px)}
.logo{font-size:20px;letter-spacing:.4em}
.pill{border:1px solid #f4f1ea;border-radius:99px;padding:6px 18px;font-size:13px;letter-spacing:.2em}
.ring{width:38px;height:38px;border:1px solid #f4f1ea;border-radius:50%;display:grid;place-content:center;gap:5px}.ring i{display:block;width:16px;height:1px;background:#f4f1ea}
.right{display:flex;gap:16px;align-items:center}
.center{position:absolute;left:0;right:0;top:50%;transform:translateY(-54%);text-align:center}
.center small{display:block;font-style:italic;font-size:clamp(16px,1.6vw,22px);opacity:.85;letter-spacing:.05em;margin-bottom:.3em}
.center h1{font-family:Jost,"Hiragino Sans",sans-serif;font-weight:200;font-size:clamp(90px,19vw,290px);line-height:.9;letter-spacing:.03em}
.btn{display:inline-block;margin-top:clamp(20px,3vw,40px);background:#f4f1ea;color:#2a241d;border-radius:99px;padding:12px 28px;font-style:italic;font-size:17px}
.jp{font-style:normal;font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-size:15px;letter-spacing:.12em}
footer{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:space-between;padding:0 clamp(20px,3vw,40px);font-style:italic;font-size:17px;opacity:.9}
@media(max-width:700px){footer{flex-direction:column;gap:6px}}
</style>
<canvas id=stage></canvas>
<header><span class=logo>NAUS</span><div class=right><span class=pill>相談する</span><span class=ring><i></i><i></i></span></div></header>
<div class=center><small>Welcome to the</small><h1>NAUS</h1><a class=btn>Enter</a></div>
<footer><span>Furniture, entirely taken care of.</span><span class=jp>美しい家は、美しい家具から</span></footer>
<form id=memo hidden></form><pre id=out hidden></pre>
<script src=e-chair.js></script>
