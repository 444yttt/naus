<!doctype html><meta charset=utf-8><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from './vendor/jsm/exporters/GLTFExporter.js';
import { buildRoom } from './room-model.js';
const scene = new THREE.Scene(); scene.add(buildRoom());
new GLTFExporter().parse(scene, buf => {
  const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  window.__glb = btoa(s); window.__done = true;
}, e => { window.__err = String(e); window.__done = true; }, { binary: true });
</script>
